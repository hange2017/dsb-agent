name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"] # 打 tag v<version> 触发发布(如 v0.1.0,须与 package.json 的 version 一致)
  pull_request:
  workflow_dispatch:

# 创建 GitHub Release 需要写权限(新仓库默认只读)
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 打包内置多平台 ripgrep(Linux CI 机器默认只装 linux 包;手动拉取其余平台,
      # esbuild copyRipgrepBinary 会全部复制进 dist/bin,保证 Windows/macOS 用户有内置 rg)
      - name: Fetch multi-platform ripgrep binaries
        run: |
          mkdir -p /tmp/rg node_modules/@vscode
          for pkg in win32-x64 darwin-x64 darwin-arm64; do
            npm pack "@vscode/ripgrep-$pkg"@1.18.0 --pack-destination /tmp/rg >/dev/null 2>&1 || { echo "npm pack failed for $pkg"; exit 1; }
            tar -xzf /tmp/rg/vscode-ripgrep-$pkg-*.tgz -C /tmp/rg
            mkdir -p "node_modules/@vscode/ripgrep-$pkg"
            cp -r /tmp/rg/package/* "node_modules/@vscode/ripgrep-$pkg/"
            rm -rf /tmp/rg/package
          done
          ls node_modules/@vscode/

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Compile (esbuild)
        run: npm run compile

      - name: Package .vsix (smoke)
        run: npx vsce package --out dist/dsb-agent-ci.vsix

      - name: Verify vsix artifact
        run: |
          test -f dist/dsb-agent-ci.vsix
          ls -lh dist/dsb-agent-ci.vsix
          unzip -l dist/dsb-agent-ci.vsix | grep -E "extension.js|webview/main.js|bin/rg" || true

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsb-agent-vsix
          path: dist/dsb-agent-ci.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    # 仅在 push tag v* 时发布(如 v0.1.0);需在仓库 Settings → Secrets and variables
    # 配置 VSCE_PAT:Azure DevOps PAT,权限范围勾选 Marketplace → Manage。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 打包内置多平台 ripgrep(Linux CI 机器默认只装 linux 包;手动拉取其余平台,
      # esbuild copyRipgrepBinary 会全部复制进 dist/bin,保证 Windows/macOS 用户有内置 rg)
      - name: Fetch multi-platform ripgrep binaries
        run: |
          mkdir -p /tmp/rg node_modules/@vscode
          for pkg in win32-x64 darwin-x64 darwin-arm64; do
            npm pack "@vscode/ripgrep-$pkg"@1.18.0 --pack-destination /tmp/rg >/dev/null 2>&1 || { echo "npm pack failed for $pkg"; exit 1; }
            tar -xzf /tmp/rg/vscode-ripgrep-$pkg-*.tgz -C /tmp/rg
            mkdir -p "node_modules/@vscode/ripgrep-$pkg"
            cp -r /tmp/rg/package/* "node_modules/@vscode/ripgrep-$pkg/"
            rm -rf /tmp/rg/package
          done
          ls node_modules/@vscode/

      - name: Compile (esbuild)
        run: npm run compile

      - name: Package .vsix
        run: npx vsce package --out dist/dsb-agent-release.vsix

      # Marketplace 发布:未配置 VSCE_PAT 时(如网页手动上传)不阻塞 GitHub Release。
      # 若已配置,发布到官方 Marketplace;失败仅告警,不中断。
      - name: Publish to VS Code Marketplace
        continue-on-error: true
        run: npx vsce publish -p "${{ secrets.VSCE_PAT }}" --packagePath dist/dsb-agent-release.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsb-agent-release.vsix
          generate_release_notes: true
