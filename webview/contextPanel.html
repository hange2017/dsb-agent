<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src ${cspSource}; img-src ${cspSource} data:;">
<link href="${styles}" rel="stylesheet">
<style>
  body { display: block; height: auto; padding: 16px 20px; }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 13px; margin: 18px 0 8px; opacity: 0.9; font-weight: 600; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar h1 { margin-right: auto; }
  .toolbar h2 { margin: 0; }
  .hint { font-size: 11px; opacity: 0.65; }
  #status { font-size: 12px; opacity: 0.8; flex: 1 1 100%; min-height: 16px; }
  #status.error { color: #f43f5e; opacity: 1; }
  .card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: rgba(127, 127, 127, 0.06);
  }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-name { font-weight: 600; font-size: 13px; font-family: var(--vscode-editor-font-family, monospace); }
  .card-meta { font-size: 11px; opacity: 0.6; margin-left: auto; }
  .card-summary { font-size: 12px; opacity: 0.85; flex: 1 1 100%; word-break: break-all; }
  .card-body {
    margin: 8px 0 0; padding: 8px;
    background: rgba(127, 127, 127, 0.08);
    border-radius: 6px;
    font-family: var(--vscode-editor-font-family, monospace);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow: auto;
  }
  .badge {
    font-size: 10px; line-height: 1.6;
    padding: 0 6px; border-radius: 8px;
    background: #1d4ed8; color: #fff;
  }
  .badge.role { background: #64748b; }
  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .card-actions button, .toolbar button, select {
    background: transparent; border: 1px solid var(--border);
    color: var(--fg); border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font-size: 12px;
  }
  select { background: var(--vscode-input-background, transparent); }
  .card-actions button.primary { background: var(--accent, #1d4ed8); color: #fff; border-color: transparent; }
  .card-actions button.danger { color: #f43f5e; border-color: rgba(244, 63, 94, 0.5); }
  .empty { opacity: 0.6; font-size: 12px; padding: 8px 0; }
  .hidden { display: none !important; }
  #detailHeader { font-size: 12px; opacity: 0.75; margin-bottom: 6px; }
</style>
</head>
<body>
<header class="toolbar">
  <h1 data-i18n="冷存储浏览">冷存储浏览</h1>
  <span class="hint" data-i18n="被分轨压缩替换出上下文的原文,按会话持久化;可浏览、清空、删除或合并去重。">被分轨压缩替换出上下文的原文,按会话持久化;可浏览、清空、删除或合并去重。</span>
  <div id="status"></div>
</header>

<section id="sessionsSection">
  <div class="toolbar">
    <h2 data-i18n="会话">会话</h2>
    <button id="refreshBtn" data-i18n="刷新">刷新</button>
    <button id="mergeAllBtn" data-i18n="合并去重(全部)">合并去重(全部)</button>
  </div>
  <div id="sessionList"></div>
</section>

<section id="chunksSection">
  <div class="toolbar">
    <h2 data-i18n="块">块</h2>
    <select id="typeFilter">
      <option value="all" data-i18n="全部类型">全部类型</option>
      <option value="demand" data-i18n="需求">需求</option>
      <option value="conclusion" data-i18n="结论">结论</option>
      <option value="explanation" data-i18n="说明">说明</option>
      <option value="ledger" data-i18n="工具履历">工具履历</option>
    </select>
  </div>
  <div id="detailHeader"></div>
  <div id="chunkList"></div>
</section>

<script src="${scripts}"></script>
</body>
</html>
